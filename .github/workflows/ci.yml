name: ci
on: [push, pull_request]
jobs:
  test:
    # a test that hangs ends the job instead of holding it for six hours
    timeout-minutes: 30
    strategy:
      # one system failing does not stop the others: each run says what is wrong everywhere
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev pkg-config
      - run: cargo build --workspace
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
