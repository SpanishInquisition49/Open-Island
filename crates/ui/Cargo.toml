[package]
name = "island-ui"
description = "open-island: the island's state machine and its macOS-style rendering (vello), without any windowing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
island-core = { path = "../core" }
vello = "0.12"
skrifa = { version = "0.49", default-features = false, features = ["std"] }
fontdb = "0.24"
# font files are mapped into memory instead of being copied into it
memmap2 = "0.9"
log = "0.4"
# the OS random source, for passwords and dice from the command bar
getrandom = "0.3"

[dev-dependencies]
png = "0.18"
pollster = "1.0"
