[package]
name = "open-island"
description = "A macOS-style dynamic island for any desktop (Linux, Windows, macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "open-island"
path = "src/main.rs"

[dependencies]
island-core = { path = "../core" }
island-ui = { path = "../ui" }
vello = "0.12"
winit = "0.30"
pollster = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
interprocess = "2"
serde_json = "1"
roxmltree = "0.20"
base64 = "0.22"
portable-pty = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
env_logger = "0.11"

# TLS: rustls on Linux; the system's own stack (schannel / Secure Transport) elsewhere, which needs no C toolchain
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }
# CalDAV needs PROPFIND and REPORT, which ureq refuses
attohttpc = { version = "0.32", default-features = false, features = ["tls-rustls-webpki-roots"] }
# ureq uses ring and attohttpc aws-lc: with both present rustls cannot pick a default, so one is installed at start
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "json", "gzip"] }
attohttpc = { version = "0.32", default-features = false, features = ["tls-native"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component"] }
starship-battery = "0.12"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi",
] }

[dev-dependencies]
png = "0.18"
