[package]
name = "open-island"
description = "A macOS-style dynamic island for any desktop (Linux, Windows, macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "open-island"
path = "src/main.rs"

[dependencies]
island-core = { path = "../core" }
island-ui = { path = "../ui" }
vello = "0.12"
# the drawn scene read as bytes, to tell a frame equal to the one on screen
bytemuck = "1"
winit = "0.30"
pollster = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
interprocess = "2"
serde_json = "1"
roxmltree = "0.20"
base64 = "0.22"
portable-pty = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
env_logger = "0.11"
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }

# TLS: rustls on Linux; the system's own stack (schannel / Secure Transport) elsewhere, which needs no C toolchain
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }
# CalDAV needs PROPFIND and REPORT, which ureq refuses
attohttpc = { version = "0.32", default-features = false, features = ["tls-rustls-webpki-roots"] }
# ureq uses ring and attohttpc aws-lc: with both present rustls cannot pick a default, so one is installed at start
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# receiving files over LocalSend: the certificate of this machine, hashes and random tokens
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
raw-window-handle = "0.6"

# who is at the other end of a socket; helper processes that die with the island (PR_SET_PDEATHSIG)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "json", "gzip"] }
attohttpc = { version = "0.32", default-features = false, features = ["tls-native"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component"] }
starship-battery = "0.12"
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# the Keychain, where passwords and API keys are kept
security-framework = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# the `interface` macro expands to paths in this crate
windows-core = "0.62"
# reads the database where Windows keeps the notifications
rusqlite = { version = "0.37", features = ["bundled"] }
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Media", "Media_Control", "Storage_Streams", "Devices_Radios", "Devices_Geolocation",
  "Win32_Foundation", "Win32_Security_Credentials", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_DataExchange", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Power", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Threading",
] }

[dev-dependencies]
png = "0.18"
