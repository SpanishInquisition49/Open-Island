[package]
name = "island-core"
description = "Platform-independent logic of open-island: faces, springs, timers, lyrics, weather, calendar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
emojis = "0.9"
serde_json = "1"
zeroize = { version = "1.9", default-features = false }

# the pages that hold a password are kept out of the swap
[target.'cfg(unix)'.dependencies]
libc = "0.2"
